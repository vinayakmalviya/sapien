<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
      <title id="arch-title">Weekend build architecture with tool stack</title>
      <desc id="arch-desc">A candidate's session flows from a frontend running MediaPipe Face Landmarker through a single API layer into a session handler built on FastAPI, which fans out to three services — a rule-based liveness scorer on MediaPipe landmark data, a pretrained dima806 ViT deepfake frame classifier, and the existing voice detection prototype — all three feeding a decision engine that returns a real-or-synthetic signal back to the frontend.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: Detection Services (drawn before arrows and nodes) -->
      <rect x="616" y="64" width="496" height="368" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="792" y="72" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="864" y="81" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DETECTION SERVICES</text>

      <!-- Arrows (behind nodes) -->
      <line x1="160" y1="316" x2="216" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="368" y1="316" x2="424" y2="316" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- API Layer -> Session Handler (right+up elbow) -->
      <path d="M 500,284 V 148 Q 500,140 508,140 H 632"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Session Handler fan-out to the three services (straight verticals, aligned attach points) -->
      <line x1="701" y1="172" x2="701" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="864" y1="172" x2="864" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1027" y1="172" x2="1027" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Services -> Decision Engine (straight verticals) -->
      <line x1="701" y1="284" x2="701" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="864" y1="284" x2="864" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1027" y1="284" x2="1027" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Decision Engine -> Frontend, dashed return signal -->
      <path d="M 632,376 H 344 Q 332,376 332,364 V 348"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="374" y="298" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="396" y="307" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALL</text>

      <rect x="474" y="206" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="498" y="215" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>

      <rect x="418" y="352" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="466" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REAL / SYNTHETIC</text>

      <!-- Node: Candidate (input) -->
      <rect x="40" y="284" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="284" width="120" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="292" width="30" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="63" y="301" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="100" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Candidate</text>
      <text x="100" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser / device</text>

      <!-- Node: Frontend -->
      <rect x="216" y="284" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="284" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="224" y="292" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="236" y="301" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="292" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frontend / Demo UI</text>
      <text x="292" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MediaPipe (in-browser)</text>

      <!-- Node: API Layer (focal) -->
      <rect x="424" y="284" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="424" y="284" width="152" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="432" y="292" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="446" y="301" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="500" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Layer</text>
      <text x="500" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Single integration pt</text>

      <!-- Node: Session Handler -->
      <rect x="632" y="108" width="464" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="108" width="464" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="640" y="116" width="52" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="666" y="125" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FASTAPI</text>
      <text x="864" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Session Handler</text>
      <text x="864" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Issues prompts, stores state</text>

      <!-- Node: Liveness Scorer (rule-based, on MediaPipe data) -->
      <rect x="632" y="220" width="138" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="220" width="138" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="640" y="228" width="34" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="657" y="237" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RULE</text>
      <text x="701" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Liveness Scorer</text>
      <text x="701" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MediaPipe + rules</text>

      <!-- Node: Frame Classifier (pretrained ML, deepfake artifact check) -->
      <rect x="795" y="220" width="138" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="795" y="220" width="138" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="803" y="228" width="22" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="814" y="237" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ML</text>
      <text x="864" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frame Classifier</text>
      <text x="864" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dima806 ViT (HF)</text>

      <!-- Node: Voice Detection Service -->
      <rect x="958" y="220" width="138" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="958" y="220" width="138" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="966" y="228" width="30" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="981" y="237" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SVC</text>
      <text x="1027" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Voice Detection</text>
      <text x="1027" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Existing prototype</text>

      <!-- Node: Decision Engine -->
      <rect x="632" y="344" width="464" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="632" y="344" width="464" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="640" y="352" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="654" y="361" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEC</text>
      <text x="864" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Decision Engine</text>
      <text x="864" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Combines scores → signal</text>
    </svg>